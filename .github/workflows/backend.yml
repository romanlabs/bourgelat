# Controles del backend en cada PR a develop y main.
# No despliega nada: Render sigue construyendo por su cuenta desde render.yaml.
#
# Sin filtro de rutas a propósito: el job `pruebas` corre en ~1 min y así puede
# marcarse como check obligatorio (un workflow filtrado por rutas no reporta en
# los PR que no tocan backend y los deja esperando).
name: Backend

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4 # igual que el Dockerfile (node:22.23.4-alpine)
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Pruebas unitarias sin base de datos ni .env.
      - name: Pruebas
        run: npm test

  # Bloquea el PR si una dependencia de producción tiene una vulnerabilidad
  # alta o crítica. NUNCA `npm audit fix --force` (baja Sequelize a la v3).
  auditoria:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      - name: Dependencias con vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
