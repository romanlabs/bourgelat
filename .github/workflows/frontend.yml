# Controles del frontend en cada PR a develop y main.
# No despliega nada: Render sigue construyendo por su cuenta desde render.yaml.
name: Frontend

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Identidad «Papel y pulso»: sin colores sueltos fuera de los tokens.
      - name: Colores (tokens)
        run: npm run lint:colores

      - name: Build
        run: npm run build

      - name: Pruebas unitarias
        run: npx vitest run
